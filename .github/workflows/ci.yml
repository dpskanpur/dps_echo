name: PR & Build Validation

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  validate:
    name: Build & Type Safety Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dps_echo/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate & Generate Prisma Client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Execute Next.js Build
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
