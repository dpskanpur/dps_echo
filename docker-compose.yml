# Local PostgreSQL for development.
#
#   docker compose up -d
#   npx prisma migrate dev --name init
#   npm run db:seed
#
# The previous SQLite file (prisma/dev.db) is no longer used: Cloud Run
# instances are ephemeral and horizontally scaled, so a file-backed database
# loses data on every deploy and diverges across instances.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dps_echo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dps_echo
    ports:
      - "5432:5432"
    volumes:
      - dps_echo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dps_echo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dps_echo_pgdata:
