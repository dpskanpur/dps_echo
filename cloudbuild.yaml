steps:
  # Step 1: Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest'
      - '.'

  # Step 2: Push Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest'

  # Step 3: Deploy Service to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      # Public hostname, so OAuth redirects don't use the container's
      # internal 0.0.0.0:8080 address.
      - '--set-env-vars=NEXTAUTH_URL=${_APP_URL},NEXT_PUBLIC_APP_URL=${_APP_URL}'
      # Credentials come from Secret Manager — never the repo or the image.
      # Created by ./scripts/setup-secrets.sh
      - '--set-secrets=DATABASE_URL=dps-echo-database-url:latest,SESSION_SECRET=dps-echo-session-secret:latest,GOOGLE_CLIENT_ID=dps-echo-google-client-id:latest,GOOGLE_CLIENT_SECRET=dps-echo-google-client-secret:latest'

substitutions:
  _PROJECT_ID: 'dpskanpur-backup'
  _REGION: 'asia-southeast1'
  _SERVICE_NAME: 'dps-echo'

images:
  - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:$BUILD_ID'
  - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest'

logsBucket: 'gs://dpskanpur-backup_cloudbuild/logs'

options:
  machineType: 'N1_HIGHCPU_8'
